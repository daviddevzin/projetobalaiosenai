<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo-balaio.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#1dc16ad9;
  --wine-soft:#29382e;
  --blush:#F7ECE7;
  --gold:#fffefb;
  --gold-ink:#5B430F;
  --terracotta:#B5622E;
  --teal:#3C7A78;
  --plum:#6B4A8C;
  --paper:#FFFFFF;
  --ink:#2B2320;
  --ink-soft:#8A7D74;
  --line:#EEE1D9;
  --success:#3C8C5C;
  --danger:#B3432F;
  --page-bg:#F2E9E2;
  --page-text:#2B2320;
  --panel-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg:#171213;
    --page-text:#F2E9E2;
    --panel-bg:#201A1B;
    --line:#382E2F;
  }
}
:root[data-theme="dark"]{
  --page-bg:#171213;
  --page-text:#F2E9E2;
  --panel-bg:#201A1B;
  --line:#382E2F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--page-text);font-family:'Poppins',sans-serif;min-height:100vh;}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;font-weight:700;margin:0;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--gold);color:var(--wine);}

.stage{max-width:1180px;margin:0 1fr;padding:36px 24px 60px;display:grid;grid-template-columns:minmax(280px,380px) auto;gap:48px;align-items:start;}
@media (max-width:880px){.stage{grid-template-columns:1fr;justify-items:center;}}

.info-panel{padding-top:8px;}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brandmark .icon-badge{width:38px;height:38px;border-radius:10px;background:var(--wine);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;}
.brandmark span{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--page-text);}
.info-panel h1{font-size:42px;line-height:1.04;color:var(--page-text);margin-bottom:14px;}
.info-panel .tagline{font-size:16px;line-height:1.55;color:var(--page-text);opacity:0.72;max-width:38ch;margin-bottom:26px;}
.info-flow{border-top:1px solid var(--line);padding-top:18px;margin-bottom:26px;}
.info-flow .flow-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.info-flow .flow-row:last-child{border-bottom:none;}
.flow-num{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--gold);width:22px;flex-shrink:0;padding-top:1px;}
.flow-text{font-size:13.5px;line-height:1.5;opacity:0.82;}
.flow-text b{font-weight:600;opacity:1;}
.demo-switch{background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;padding:16px;}
.demo-switch p{font-size:12.5px;opacity:0.65;margin:0 0 10px;line-height:1.4;}
.demo-switch .row{display:flex;gap:8px;}
.role-btn{flex:1;border:1px solid var(--line);background:transparent;color:var(--page-text);border-radius:7px;padding:10px 8px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;}
.role-btn.active{background:var(--wine);border-color:var(--wine);color:#fff;}
.role-btn svg{width:18px;height:18px;}

.phone-shell{width: 330px;px;max-width:100%;background:#0d0d0c;border-radius:44px;padding:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.45) justify-self:center;}
.phone-screen{position:relative;width:100%;height:550px;background:var(--blush);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;font-family:'Nunito',sans-serif;color:var(--ink);}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#0d0d0c;border-radius:0 0 16px 16px;z-index:50;}
.statusbar{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink);}
.app-view{flex:1;min-height:0;overflow-y:auto;position:relative;-ms-overflow-style:none;scrollbar-width:none;}
.app-view::-webkit-scrollbar{display:none;}
.screen-pad{padding:4px 20px 24px;}

.tabbar{flex-shrink:0;display:flex;border-top:1px solid var(--line);background:var(--paper);padding:8px 6px 14px;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-soft);padding:6px 2px;border-radius:8px;position:relative;}
.tab-item svg{width:21px;height:21px;}
.tab-item span{font-size:10.5px;font-weight:600;}
.tab-item.active{color:var(--wine);}
.tab-item.active svg{stroke:var(--gold);}
.tab-count{position:absolute;top:0;right:22%;background:var(--wine);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;flex-shrink:0;}
.back-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.back-btn svg{width:17px;height:17px;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;}
.icon-btn svg{width:17px;height:17px;}
.dot-badge{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--paper);}

.btn{border:none;border-radius:9px;padding:13px 18px;font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.btn-primary{background:var(--wine);color:#fff;}
.btn-gold{background:var(--gold);color:var(--gold-ink);}
.btn-outline{background:transparent;color:var(--wine);border:1.5px solid var(--wine);}
.btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;}
.btn-danger-outline{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;}
.btn[disabled]{opacity:0.45;pointer-events:none;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink);}
.field textarea{resize:none;min-height:64px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.check-row{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-soft);line-height:1.4;margin:12px 0 16px;}
.check-row input{margin-top:2px;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
.rating{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink);}
.rating svg{width:12px;height:12px;fill:var(--gold);stroke:var(--gold);}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;-ms-overflow-style:none;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);min-width:68px;}
.chip.active{border-color:var(--cat-color,var(--wine));background:color-mix(in srgb, var(--cat-color,var(--wine)) 12%, white);}
.chip svg{width:19px;height:19px;color:var(--cat-color,var(--ink));}
.chip span{font-size:10.5px;font-weight:600;text-align:center;line-height:1.2;color:var(--ink);}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:4px;}
.search-bar svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
.search-bar span{font-size:13.5px;color:var(--ink-soft);}

.promo-banner{background:linear-gradient(120deg,var(--wine),var(--wine-soft));border-radius:12px;padding:16px 16px;color:#fff;margin:12px 0 6px;position:relative;overflow:hidden;}
.promo-banner .tag{font-size:10.5px;font-weight:700;letter-spacing:0.4px;color:var(--gold);text-transform:uppercase;}
.promo-banner h3{color:#fff;font-size:19px;margin:4px 0 3px;}
.promo-banner p{font-size:12px;opacity:0.85;margin:0;}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px;}
.section-title h3{font-size:18px;font-weight:700;}
.section-title a{font-size:12px;font-weight:600;color:var(--teal);text-decoration:none;}

.store-card{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:10px;border-left:4px solid var(--cat-color,var(--wine));width:100%;text-align:left;}
.store-card .avatar{width:48px;height:48px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:#fff;background:var(--cat-color,var(--wine));}
.store-card .info{flex:1;min-width:0;}
.store-card .name{font-weight:700;font-size:14.5px;margin-bottom:2px;}
.store-card .cat{font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
.store-card .meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}

.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.prod-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;}
.prod-card .ph{height:88px;overflow:hidden;}
.prod-card .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.prod-card .body{padding:9px 10px 11px;}
.prod-card .name{font-size:12.5px;font-weight:600;line-height:1.25;margin-bottom:4px;min-height:31px;}
.prod-card .price{font-size:13.5px;font-weight:700;color:#000000f7;}
.prod-card .stock-mini{font-size:10px;color:var(--ink-soft);margin-top:2px;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
.stat-card{border-left:3px solid var(--cat-color,var(--gold));background:var(--paper);border-radius:8px;padding:12px 13px;flex:1;}
.stat-card .num{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;line-height:1;}
.stat-card .lbl{font-size:10.5px;color:var(--ink-soft);margin-top:4px;font-weight:600;}

.status-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap;}
.status-analise{background:#FDECC8;color:#8A5A00;}
.status-confirmado{background:#DCE6F0;color:var(--teal);}
.status-preparando{background:#EFE2CF;color:var(--gold-ink);}
.status-pronto{background:#E4DCF0;color:var(--plum);}
.status-caminho{background:#DCE9E8;color:var(--teal);}
.status-concluido{background:#DCEEE2;color:var(--success);}
.status-recusado{background:#F3DCD6;color:var(--danger);}

.list-row{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
.list-row:last-child{border-bottom:none;}
.list-row .avatar-sm{width:42px;height:42px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#fff;background:var(--cat-color,var(--wine));}
.list-row .body{flex:1;min-width:0;}
.list-row .top-line{display:flex;justify-content:space-between;gap:6px;}
.list-row .title{font-weight:700;font-size:13.5px;}
.list-row .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;}
.stepper button svg{width:12px;height:12px;}
.stepper .val{font-weight:700;font-size:14px;min-width:18px;text-align:center;}

.size-row{display:flex;gap:8px;flex-wrap:wrap;}
.size-chip{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
.size-chip.selected{border-color:var(--wine);background:var(--wine);color:#fff;}

.sync-note{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--success);background:#EAF5EE;border-radius:8px;padding:8px 10px;margin:10px 0;}
.sync-note svg{width:14px;height:14px;flex-shrink:0;}

.track-step{display:flex;gap:10px;padding-bottom:18px;position:relative;}
.track-step:last-child{padding-bottom:0;}
.track-step .dotline{display:flex;flex-direction:column;align-items:center;}
.track-step .dot{width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid var(--line);flex-shrink:0;}
.track-step.done .dot{background:var(--success);border-color:var(--success);}
.track-step.current .dot{background:var(--gold);border-color:var(--gold);}
.track-step .bar{width:2px;flex:1;background:var(--line);margin-top:2px;}
.track-step.done .bar{background:var(--success);}
.track-step .txt{padding-top:-1px;}
.track-step .t{font-size:13px;font-weight:700;}
.track-step .d{font-size:11px;color:var(--ink-soft);margin-top:1px;}

.chat-header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
.chat-header .avatar-sm{width:36px;height:36px;font-size:12px;}
.chat-header .who{flex:1;}
.chat-header .who .name{font-weight:700;font-size:14px;}
.chat-header .who .status{font-size:11px;color:var(--ink-soft);}
.chat-body{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;}
.msg-row{display:flex;}
.msg-row.mine{justify-content:flex-end;}
.bubble{max-width:76%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.42;}
.msg-row.theirs .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px;}
.msg-row.mine .bubble{background:var(--wine);color:#fff;border-bottom-right-radius:3px;}
.msg-row.system{justify-content:center;}
.msg-row.system .bubble{background:transparent;color:var(--ink-soft);font-size:11.5px;text-align:center;max-width:90%;}
.chat-input-row{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line);flex-shrink:0;align-items:center;}
.chat-input-row input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:13.5px;font-family:inherit;background:var(--paper);}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--wine);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn svg{width:16px;height:16px;}
.quick-replies{display:flex;gap:7px;padding:0 14px 10px;flex-wrap:wrap;}
.quick-reply{border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--wine);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:0.5;}
.empty-state p{font-size:13px;line-height:1.5;}

.toggle{width:42px;height:24px;border-radius:14px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.toggle.on{background:var(--success);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,0.25);}
.toggle.on::after{transform:translateX(18px);}

.welcome-wrap{padding:46px 26px 24px;display:flex;flex-direction:column;height:100%;}
.welcome-logo{display:flex;align-items:center;gap:10px;margin-bottom:auto;}
.welcome-logo .icon-badge{width:34px;height:34px;border-radius:9px;background:var(--wine);display:flex;align-items:center;justify-content:center;color:var(--gold);}
.welcome-logo span{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;}
.welcome-mid{margin:24px 0 26px;}
.welcome-mid h1{font-size:36px;line-height:1.05;margin-bottom:12px;}
.welcome-mid p{font-size:14px;color:var(--ink-soft);line-height:1.5;max-width:30ch;}
.role-pick{display:flex;gap:10px;margin-bottom:16px;}
.role-card{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:16px 12px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.role-card.selected{border-color:var(--wine);background:#FBF3F0;}
.role-card svg{width:22px;height:22px;color:var(--wine);}
.role-card .t{font-weight:700;font-size:14px;}
.role-card .d{font-size:11px;color:var(--ink-soft);line-height:1.3;}

.avatar-lg{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;color:#fff;background:var(--wine);flex-shrink:0;}

.doc-upload{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;background:var(--paper);}
.doc-upload svg{width:24px;height:24px;color:var(--ink-soft);margin-bottom:6px;}
.doc-upload .t{font-size:12.5px;font-weight:600;}
.doc-upload .d{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.doc-upload.uploaded{border-style:solid;border-color:var(--success);background:#EAF5EE;}
.doc-upload.uploaded svg{color:var(--success);}

.plan-card{border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;}
.plan-card.selected{border-color:var(--wine);background:#FBF3F0;}
.plan-card .top-line{display:flex;justify-content:space-between;align-items:center;}
.plan-card .t{font-weight:700;font-size:14px;}
.plan-card .p{font-weight:700;font-size:14px;color:var(--wine);}
.plan-card .d{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}

.radio-row{display:flex;gap:10px;}
.radio-opt{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:11px;display:flex;align-items:center;gap:8px;}
.radio-opt.selected{border-color:var(--wine);background:#FBF3F0;}
.radio-opt svg{width:16px;height:16px;color:var(--wine);}
.radio-opt span{font-size:12.5px;font-weight:600;}

.cart-store-block{margin-bottom:16px;}
.cart-store-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:8px;}
.cart-store-head svg{width:15px;height:15px;color:var(--ink-soft);}
.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;}
.cart-item .ph{width:48px;height:48px;border-radius:8px;flex-shrink:0;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .name{font-size:12.5px;font-weight:600;}
.cart-item .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.cart-item .price{font-size:12.5px;font-weight:700;}
.cart-totals{font-size:12.5px;color:var(--ink-soft);display:flex;justify-content:space-between;padding:4px 0;}
.cart-totals.grand{font-size:15px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
</style>
</head>
<body>

<div class="stage">
  <div class="info-panel">
    <div class="brandmark">
     <img src="logo-balaio.png" alt="Balaio! Marketplace" class="brand-logo" style="width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;">
      <span>MarketPlace Balaio!</span>
    </div>
    <div class="demo-switch">
      <p>Alterne o modo de apresentação para amostrar cada usuário.</p>
      <div class="row">
        <button class="role-btn active" id="demoBtnCliente" onclick="demoSwitch('cliente')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-3.8 4-5.8 7-5.8s6 2 7 5.8"/></svg>
          Visão cliente

/* ============================= NAV ============================= */
function go(screen, extra){
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();
  const av = document.getElementById('appView');
  if(av) av.scrollTop = 0;
}
function setTab(tab){ state.tab = tab; render(); }

function demoSwitch(role){
  state.role = role;
  document.getElementById('demoBtnCliente').classList.toggle('active', role==='cliente');
  document.getElementById('demoBtnLojista').classList.toggle('active', role==='lojista');
  state.tab='inicio';
  go(role==='cliente' ? 'home-cliente' : 'home-lojista');
}

function render(){
  const av = document.getElementById('appView');
  const tb = document.getElementById('tabbarWrap');
  av.innerHTML = screens[state.screen] ? screens[state.screen]() : '<div class="screen-pad">tela não encontrada</div>';
  tb.innerHTML = tabbarFor(state.screen);
}
function tabbarFor(screen){
  const noTab = ['welcome','cadastro-cliente','cadastro-lojista','em-analise','chat','support-chat','produto','pedido-confirmado','checkout'];
  if(noTab.includes(screen)) return '';
  if(state.role==='cliente'){
    return tabbarHtml([
      {id:'inicio', label:'Início', icon:ic.home, screen:'home-cliente'},
      {id:'carrinho', label:'Sacola', icon:ic.cart, screen:'carrinho', count:cartCount()},
      {id:'pedidos', label:'Pedidos', icon:ic.package, screen:'pedidos-cliente'},
      {id:'perfil', label:'Perfil', icon:ic.user, screen:'perfil-cliente'},
    ]);
  } else {
    return tabbarHtml([
      {id:'inicio', label:'Painel', icon:ic.home, screen:'home-lojista'},
      {id:'estoque', label:'Estoque', icon:ic.boxes, screen:'estoque-lojista'},
      {id:'pedidos', label:'Pedidos', icon:ic.package, screen:'pedidos-lojista'},
      {id:'perfil', label:'Perfil', icon:ic.user, screen:'perfil-lojista'},
    ]);
  }
}
function tabbarHtml(items){
  return `<div class="tabbar">${items.map(it=>`
    <button class="tab-item ${state.tab===it.id?'active':''}" onclick="setTab('${it.id}');go('${it.screen}')">
      ${it.icon}<span>${it.label}</span>
      ${it.count? `<span class="tab-count">${it.count}</span>` : ''}
    </button>`).join('')}</div>`;
}
function statusTag(status){
  const map = {
    analise:['Em análise','status-analise'], novo:['Novo pedido','status-analise'],
    confirmado:['Confirmado','status-confirmado'], preparando:['Preparando','status-preparando'],
    pronto:['Pronto p/ retirada','status-pronto'], caminho:['A caminho','status-caminho'],
    concluido:['Concluído','status-concluido'], recusado:['Recusado','status-recusado'],
  };
  const [t,cls] = map[status]||['—',''];
  return `<span class="status-tag ${cls}">${t}</span>`;
}
function emptyState(msg){ return `<div class="empty-state">${ic.empty}<p>${msg}</p></div>`; }

  const p = findProduct(state.currentProductId);
  state.cart.push({productId:p.id, storeId:p.storeId, qty:state.qty, size:state.selectedSize, price:p.price, name:p.name});

  let lastId;
  Object.entries(byStore).forEach(([storeId,items])=>{
    storeId = Number(storeId);
    const mode = state.deliveryMode[storeId]||'entrega';
    const orderTotal = items.reduce((a,i)=>a+i.price*i.qty,0) + (mode==='entrega'? findStore(storeId).delivery:0);
    const order = {id:nextOrderId++, storeId, items:items.map(i=>({name:i.name,qty:i.qty,price:i.price,size:i.size})), mode, status:'confirmado', total:orderTotal, messages:[]};
    state.orders.unshift(order);
    state.storeOrders.unshift({id:nextStoreOrderId++, storeId, clientName:'Você (cliente demo)', items:order.items, mode, status:'novo', total:orderTotal, messages:[]});
    lastId = order.id;
  });
  state.cart = [];
  state.currentOrderId = lastId;
  go('pedido-confirmado');
}

/* ---- CHAT (cliente <-> loja) ---- */
screens['chat'] = () => {
  const id = state.currentChatId;
  const clientSide = state.role==='cliente';
  const order = clientSide ? state.orders.find(o=>o.id===id) : state.storeOrders.find(o=>o.id===id);
  const s = findStore(order.storeId);
  const c = CATS[s.cat];
  const otherName = clientSide ? s.name : order.clientName;
  const otherInitials = clientSide ? s.initials : order.clientName.split(' ').map(w=>w[0]).slice(0,2).join('');
  const backScreen = clientSide ? 'pedido-detalhe' : 'pedido-lojista-detalhe';
  return `
  <div class="chat-header">
    <button class="back-btn" onclick="go('${backScreen}',{currentOrderId:${order.id}})">${ic.back}</button>
    <div class="avatar-sm" style="--cat-color:${c.color}">${otherInitials}</div>
    <div class="who"><div class="name">${otherName}</div><div class="status">Pedido #${order.id}</div></div>
  </div>
  <div class="chat-body" id="chatBody">
    ${order.messages.map(m=>chatBubble(m, clientSide)).join('') || `<div class="msg-row system"><div class="bubble">Envie a primeira mensagem sobre esse pedido.</div></div>`}
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Digite uma mensagem...">
    <button class="send-btn" onclick="sendOrderMessage()">${ic.send}</button>
  </div>
  `;
};
function chatBubble(m, clientSide){
  const mine = (m.from==='cliente' && clientSide) || (m.from==='loja' && !clientSide);
  return `<div class="msg-row ${mine?'mine':'theirs'}"><div class="bubble">${m.text}</div></div>`;
}
function sendOrderMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const clientSide = state.role==='cliente';
  const id = state.currentChatId;
  const order = clientSide ? state.orders.find(o=>o.id===id) : state.storeOrders.find(o=>o.id===id);
  const from = clientSide ? 'cliente' : 'loja';
  order.messages.push({from, text});
  render();
  const body = document.getElementById('chatBody');
  if(body) body.scrollTop = body.scrollHeight;
  setTimeout(()=>{
    order.messages.push({from: from==='cliente'?'loja':'cliente', text: from==='cliente' ? 'Certo, já te aviso por aqui!' : 'Combinado, obrigado!'});
    if(state.screen==='chat') render();
    const b2 = document.getElementById('chatBody');
    if(b2) b2.scrollTop = b2.scrollHeight;
  }, 900);
}

    state.supportChat.push({from:'Suporte Balaio!', text:'Entendi, já vou verificar isso pra você e te retorno em instantes.'});

    setTimeout(()=>{
       state.supportChat.push({from:'Suporte Balaio!', text:'Para localizar o cadastro e agilizar o atendimento, você pode me informar CPF e id do pedido?.'});
       if(state.screen==='support-chat') render();
      const b = document.getElementById('chatBoy');
      if(b) b.scrollTop = b.scrollHeight;
    },1200);
  }, 900);
}
function sendSupportMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  state.supportChat.push({from:'eu', text});
  render();
  const body = document.getElementById('chatBody');

    if(state.screen==='support-chat') render();

    if(b2) b2.scrollTop = b2.scrollHeight;
  }, 900);
}
